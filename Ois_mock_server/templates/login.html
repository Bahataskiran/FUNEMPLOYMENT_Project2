            <button type="button" class="close" data-dismiss="modal" aria-hidden="true" 
                    style="position: absolute; right: -15px; top: -15px; background: #2c343c; color: #fff; opacity: 1; border-radius: 4px; width: 30px; height: 30px; line-height: 28px; text-shadow: none;">×</button>
            <h4 style="color: #d9534f; margin: 0; font-weight: bold; font-size: 16px;">Hata</h4>
        </div>
        <div class="modal-body" style="padding: 25px 20px; font-size: 14px; color: #333;">
            <p style="margin: 0;">{{ hata }}</p>
        </div>
        <div class="modal-footer" style="background-color: #f5f5f5; border-top: 1px solid #ddd; padding: 10px 20px; border-radius: 0 0 4px 4px;">

        </div>
